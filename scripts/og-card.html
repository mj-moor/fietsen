<!doctype html><meta charset="utf-8">
<!-- Source for og.png, the link-preview card. Regenerate after a redesign:
     serve the repo and screenshot this page at exactly 1200x630, e.g.

       python3 -m http.server 8899 &
       # then screenshot http://127.0.0.1:8899/scripts/og-card.html at 1200x630
       # and save it as og.png in the repository root

     The bars are the median count per hour over the complete days in data.json
     at the time of generation; the shape barely moves, so it is not worth
     automating. -->
<style>
  * { box-sizing:border-box; margin:0; }
  body { width:1200px; height:630px; background:#14161a; color:#e8eaed;
         font:16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
         -webkit-font-smoothing:antialiased; display:flex; flex-direction:column;
         justify-content:space-between; padding:70px 80px 62px; overflow:hidden; }
  h1 { font-size:74px; letter-spacing:-.028em; font-weight:700; line-height:1.05; }
  .sub { color:#98a2ae; font-size:31px; margin-top:20px; letter-spacing:-.005em; }
  .site { color:#4ea8de; font-size:27px; margin-top:34px; font-weight:600; letter-spacing:.01em; }
  .chart { display:flex; align-items:flex-end; gap:9px; height:188px; margin:0 -2px; }
  .chart i { flex:1; background:#4ea8de; border-radius:6px 6px 0 0; display:block; }
  .rule { height:3px; background:#2a2f37; }
</style>
<body>
  <div>
    <h1>Fietsen op het Gouwplein</h1>
    <div class="sub">Automatisch geteld &middot; elk uur bijgewerkt</div>
    <div class="site">fietsen.gouwplein.nl</div>
  </div>
  <div>
    <div class="chart" id="c"></div>
    <div class="rule"></div>
  </div>
<script>
  const med = [0,0,0,0,0,0,0,0,12,22,21,36,33,33,24,37,46,59,44,23,20,12,1,0];
  const peak = Math.max(...med);
  document.getElementById('c').innerHTML = med.map((v, h) => {
    const pct = v ? Math.max(v / peak * 100, 3.5) : 2.4;
    return `<i style="height:${pct}%;opacity:${v ? 0.35 + 0.65 * v / peak : 0.2}"></i>`;
  }).join('');
</script>
